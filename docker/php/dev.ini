; Ajustes SOLO para desarrollo en Docker (se montan en el servicio "tools").
; En Windows, leer miles de archivos desde una carpeta compartida es muy lento: estas opciones
; guardan el código compilado y las rutas en memoria para no releerlos en cada petición.
memory_limit = 1G
max_execution_time = 0   ; la primera carga en Windows puede tardar varios minutos; sin límite de 30 s en desarrollo
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
realpath_cache_size = 4096K
realpath_cache_ttl = 600
