# Reglas de capas por módulo (Clean Architecture). Falla el CI si alguien las viola.
deptrac:
  paths:
    - ./app/Modules
    - ./app/Shared
  layers:
    - name: Domain
      collectors:
        - type: directory
          value: app/(Modules/.*|Shared)/Domain/.*
    - name: Application
      collectors:
        - type: directory
          value: app/Modules/.*/Application/.*
    - name: Infrastructure
      collectors:
        - type: directory
          value: app/(Modules/.*|Shared)/Infrastructure/.*
    - name: Presentation
      collectors:
        - type: directory
          value: app/Modules/.*/Presentation/.*
    - name: Framework
      collectors:
        - type: classNameRegex
          value: '#^(Illuminate|Spatie)\\.*#'
    - name: AppModels
      collectors:
        - type: classNameRegex
          value: '#^App\\Models\\.*#'
  ruleset:
    Domain: []
    Application: [Domain]
    Infrastructure: [Domain, Application, Framework, AppModels]
    Presentation: [Domain, Application, Framework, AppModels]
